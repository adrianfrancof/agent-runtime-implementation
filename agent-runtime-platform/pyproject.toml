[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-platform"
version = "0.1.0"
description = "An executable, deliberately limited agent runtime foundation"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.50,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]
browser = ["playwright>=1.49,<2"]

[tool.setuptools.packages.find]
where = ["src"]
